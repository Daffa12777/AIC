services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alumisight
      POSTGRES_PASSWORD: alumisight
      POSTGRES_DB: alumisight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumisight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://alumisight:alumisight@db:5432/alumisight
      UPLOAD_DIR: /app/storage
      
      ML_ENGINE_URL: http://ml-engine:8000 

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./ml-engine:/app

volumes:
  pgdata: